server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12501m;
    access_log off;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
