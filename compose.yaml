services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: media
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U media -d media']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://media:${POSTGRES_PASSWORD:-local-development-only}@db/media
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  worker:
    build: ./backend
    command: [python, -m, app.worker]
    environment: *backend-env
    volumes:
      - media:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  redis:
  media:
